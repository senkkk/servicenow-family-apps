<div class="panel panel-default table-list-selector">
  <div class="panel-heading">
    <h2 class="panel-title">一覧表示・検索</h2>
  </div>
  <div class="panel-body">
    <p class="text-muted table-list-selector__description">
      表示・検索したいテーブルを選択して「表示」を押してください。下の検索結果ウィジェットのデータソースが切り替わります。
    </p>

    <form class="form-inline" ng-submit="c.applySelection()">
      <div class="form-group table-list-selector__field">
        <label for="family-table-selector">テーブル</label>
        <select id="family-table-selector"
                class="form-control"
                ng-model="c.data.selectedTable"
                ng-options="table.name as table.label for table in c.data.tables">
        </select>
      </div>
      <button type="submit" class="btn btn-primary" ng-disabled="!c.data.selectedTable">表示</button>
    </form>

    <div class="alert alert-info table-list-selector__hint" role="status">
      キーワード検索は、下の検索結果ウィジェットの検索欄を使用してください。
    </div>
  </div>
</div>
