<div class="school-request-conversation-assist panel panel-default">
  <div class="panel-heading">
    <h3 class="panel-title">学校連絡AIチャット相談（β）</h3>
  </div>
  <div class="panel-body">
    <p class="text-muted">
      学校からの連絡文や迷っている点をチャットで相談してください。AIと何度か壁打ちしながら申請内容を整え、納得できたら「フォームへ反映」を押します。
    </p>

    <div class="conversation-thread" aria-live="polite">
      <div class="conversation-empty" ng-if="!c.messages.length">
        <p>最初のメッセージ例:</p>
        <button type="button" class="btn btn-link" ng-click="c.useExample()" ng-disabled="c.loading">
          学校から配布されたプリントの内容を貼り付けて相談する
        </button>
      </div>

      <div class="conversation-message" ng-repeat="message in c.messages track by $index" ng-class="{'conversation-message-user': message.role === 'user', 'conversation-message-assistant': message.role === 'assistant'}">
        <div class="conversation-message-role" ng-bind="message.role === 'user' ? 'あなた' : 'AI'" ></div>
        <div class="conversation-message-content" ng-bind="message.content"></div>
      </div>
    </div>

    <div class="form-group" ng-class="{'has-error': c.errorMessage}">
      <label for="ai_school_conversation_text">AIへのメッセージ</label>
      <textarea
        id="ai_school_conversation_text"
        class="form-control"
        rows="4"
        ng-model="c.currentMessage"
        ng-disabled="c.loading"
        placeholder="学校からの連絡文、気になる点、親にどう頼むか迷っていることを書いてください"></textarea>
      <p class="help-block" ng-if="c.errorMessage" ng-bind="c.errorMessage"></p>
    </div>

    <div class="school-request-conversation-actions">
      <button type="button" class="btn btn-primary" ng-click="c.send()" ng-disabled="c.loading">
        <span ng-if="!c.loading">送信</span>
        <span ng-if="c.loading">相談中...</span>
      </button>
      <button type="button" class="btn btn-default" ng-click="c.reset()" ng-disabled="c.loading || !c.messages.length">
        最初からやり直す
      </button>
      <button type="button" class="btn btn-success" ng-click="c.apply()" ng-disabled="c.loading || !c.draft">
        フォームへ反映
      </button>
    </div>

    <p class="text-success conversation-info" ng-if="c.infoMessage" ng-bind="c.infoMessage"></p>

    <div class="conversation-draft" ng-if="c.draft">
      <h4>現在の申請案</h4>
      <dl class="dl-horizontal">
        <dt>依頼タイトル</dt>
        <dd ng-bind="c.draft.request_title || '未整理'"></dd>
        <dt>依頼の種類</dt>
        <dd ng-bind="c.getRequestTypeLabel(c.draft.request_type)"></dd>
        <dt>対応期限</dt>
        <dd ng-bind="c.draft.due_date || '未整理'"></dd>
        <dt>学校からの連絡内容</dt>
        <dd ng-bind="c.draft.source_summary || '未整理'"></dd>
        <dt>親に対応してほしいこと</dt>
        <dd ng-bind="c.draft.requested_action || '未整理'"></dd>
        <dt>補足</dt>
        <dd ng-bind="c.draft.notes || 'なし'"></dd>
      </dl>
      <p class="text-muted" ng-if="!c.readyToApply">
        まだ確認が必要そうです。追加情報を送るか、この内容でよければフォームへ反映してください。
      </p>
    </div>
  </div>
</div>
